<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechShop</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-box">
            <h1>TechShop</h1>
            <h2>Accedi</h2>
            <form id="loginForm" action="home.html" method="get" onsubmit="return login();">
                <p class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" placeholder="Inserisci username" required></p>
                <p class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Inserisci password" required></p>
                <input type="submit" class="btn" value="Accedi">
            </form>
            <p class="register-link">Non hai ancora un account? <a href="registrazione.html">Registrati</a></p>
        </section>
    </main>
    <script src="js/logica.js"></script>
</body>
</html>
