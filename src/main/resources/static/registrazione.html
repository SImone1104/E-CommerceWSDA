<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - TechShop</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-box">
            <h1>TechShop</h1>
            <h2>Registrazione</h2>
            <form id="registrationForm" action="login.html" method="get" onsubmit="return registerUser();">
                <p class="form-group"><label for="nome">Nome</label><input type="text" id="nome" name="nome" placeholder="Inserisci il nome" required></p>
                <p class="form-group"><label for="cognome">Cognome</label><input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" required></p>
                <p class="form-group"><label for="regUsername">Username</label><input type="text" id="regUsername" name="username" placeholder="Minimo 3 caratteri" minlength="3" required></p>
                <p class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="nome@email.it" required></p>
                <p class="form-group"><label for="regPassword">Password</label><input type="password" id="regPassword" name="password" placeholder="Minimo 6 caratteri" minlength="6" required></p>
                <p class="form-group"><label for="confermaPassword">Conferma password</label><input type="password" id="confermaPassword" name="confermaPassword" placeholder="Ripeti la password" required></p>
                <p class="checkbox-group"><input type="checkbox" id="termini" name="termini" required><label for="termini">Accetto i termini e le condizioni</label></p>
                <input type="submit" class="btn" value="Registrati">
            </form>
            <p class="register-link">Hai già un account? <a href="login.html">Torna al login</a></p>
        </section>
    </main>
    <script src="js/logica.js"></script>
</body>
</html>
